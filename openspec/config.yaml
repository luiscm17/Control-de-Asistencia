schema: spec-driven

context: |
  Tech stack: Google Apps Script (V8) — SpreadsheetApp/LockService/Session/Utilities, no npm/pip, Spanish locale es-BO
  Architecture: 5 isolated GAS projects under apps-script/ (attendance-control, coneras-production, yarn-inventory, yarn-production, yarn-settings) + dyeing (tenidos B1:I25 → db_tenidos A:AD 30 cols PK Nº Lote) — each own appsscript.json America/La_Paz
  Testing: No runner/linter/formatter/coverage — GAS Logger/VM harness manual (tests/*.test.gs), no package.json/go.mod/pyproject.toml/Cargo.toml
  Style: Spanish labels/formulas verbatim (SI.ERROR/BUSCARV/DIASEM/CONTAR.SI), incremental upsert, typed capture (STRING via getDisplayValue, NUMBER H/S:V native), LockService per write, canvas never scraped
  Constraints: No external deps, clasp under tools/ only, 90 min/day trigger quota, verify on COPY only, branch tenidos for dyeing (PRD docs/dyeing/PRD.md v0.1.0)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference PRD v0.3.6 sections 5.2-5.3, 7-10, 13 + docs/dyeing/PRD.md v0.1.0 as source of truth
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for onEdit -> Registro/db_tenidos upsert flow
    - Document Spanish locale handling and America/La_Paz timezone decisions
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing Spanish formula conventions verbatim
      - Respect E15:AI44 + Hoja2 boundaries (attendance) and B1:I25/G4 + A:AD (dyeing); never modify Hoja2
      - Verify on sheet COPY only, never prod (1iw9bduLeGXQMbjmMV1qrMqE2WoPWCBz3)
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  reason: "No workspace-level test command covers all 5 GAS projects — each has only a manual GAS Logger/VM harness (tests/*.test.gs) with no runner (no package.json, go.mod, pyproject.toml, Cargo.toml, or CI). Strict TDD unavailable."
  runner: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  linter: false
  type_checker: false
  formatter: false

